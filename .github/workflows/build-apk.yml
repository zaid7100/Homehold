name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o HouseholdFinances-AndroidWrapper.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - - name: Install Gradle 9.5
  run: |
    wget https://services.gradle.org/distributions/gradle-9.5-bin.zip
    unzip -q gradle-9.5-bin.zip
    sudo mv gradle-9.5 /opt/gradle

- name: Build APK
  working-directory: household-apk
  run: /opt/gradle/bin/gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Household-Finances-APK
          path: household-apk/app/build/outputs/apk/debug/app-debug.apk
